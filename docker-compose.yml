version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: jobportal_mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: job_portal_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - jobnet

  redis:
    image: redis:alpine
    container_name: jobportal_redis
    ports:
      - "6379:6379"
    networks:
      - jobnet

  backend:
    build: ./backend
    container_name: jobportal_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/job_portal_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - DB_PASSWORD=rootpassword
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    depends_on:
      - mysql
      - redis
    networks:
      - jobnet

volumes:
  mysql_data:

networks:
  jobnet:
    driver: bridge